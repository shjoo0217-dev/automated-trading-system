name: Investment data pipeline
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, train, health]
        default: collect
permissions:
  contents: write
concurrency:
  group: kirs-dataset-single-writer
  cancel-in-progress: false
jobs:
  batch:
    if: ${{ vars.KIRS_CLOUD_ENABLED == 'true' && vars.PIPELINE_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kirs_dataset
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies (no paid cache or artifacts)
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Restore durable checkpoint
        run: python cloud/state_branch.py restore --repo .. --state .runtime
      - name: Collect, validate, or train when sufficient
        env:
          PYTHONPATH: src
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode="${REQUESTED_MODE:-collect}"
          if [ "$EVENT_SCHEDULE" = '17 18 * * 0' ]; then mode=train; fi
          python -m investment.cli run --root . --state .runtime --mode "$mode"
      - name: Persist checkpoints and immutable ZIP even after source failure
        if: ${{ always() }}
        run: python cloud/state_branch.py save --repo .. --state .runtime
      - name: Summarize actual outcome
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('.runtime/last_run.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Investment dataset run\n\n')
              out.write('```json\n'+(p.read_text() if p.exists() else '{"status":"no_run_record; check earlier failed step"}')+'\n```\n')
          PY
      - name: Optional separately authorized Drive synchronization
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python cloud/sync_latest_drive.py
